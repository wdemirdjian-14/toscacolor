name: Publication

# Un tag = une mise en ligne. `git tag v1.0.0 && git push --tags`
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      raison:
        description: 'Pourquoi cette publication manuelle'
        required: false

permissions:
  contents: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  publier:
    name: Compiler et mettre en ligne
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Compiler
        env:
          VITE_APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: npm run build

      - name: Préparer la clé SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Un copier-coller depuis Windows ou certains navigateurs glisse des \r
          # dans le secret, et ssh refuse alors la clé sans expliquer pourquoi.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            # Empreinte épinglée : le runner ne peut pas être détourné vers un autre serveur.
            printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Contrôler les secrets
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          [ -n "$HOST" ] || { echo "::error::VPS_HOST est vide"; exit 1; }
          [ -n "$USER" ] || { echo "::error::VPS_USER est vide"; exit 1; }
          echo "cible : $USER@$HOST port ${PORT:-22}"
          # L'empreinte ne révèle rien, mais elle prouve que la clé est arrivée entière.
          ssh-keygen -lf ~/.ssh/deploy_key \
            || { echo "::error::VPS_SSH_KEY illisible : clé tronquée, ou collée sans ses retours à la ligne"; exit 1; }
          echo "entrées known_hosts : $(wc -l < ~/.ssh/known_hosts)"
          if printf '%s' "$HOST" | grep -qE '^[0-9]+(\.[0-9]+){3}$'; then
            echo "VPS_HOST est une adresse IP"
          else
            echo "VPS_HOST est un nom de domaine"
          fi
          # ssh-keygen -F fait la vraie recherche, celle que ssh fera ensuite.
          if ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null 2>&1; then
            echo "known_hosts : entrée trouvée pour l'hôte visé"
          else
            echo "::error::known_hosts ne contient aucune entrée pour VPS_HOST. Les lignes ont été scannées sur une autre valeur (IP contre nom de domaine). Rescanne l'hôte exact, ou supprime le secret VPS_KNOWN_HOSTS."
            exit 1
          fi

      - name: Envoyer sur le VPS Ionos
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
          DEST: ${{ secrets.VPS_PATH }}
        run: |
          TARGET="${DEST:-/var/www/tosca}"
          KEY="$HOME/.ssh/deploy_key"
          # La trace est capturee pour pouvoir nommer la cause : un code 255 nu
          # ne dit pas si c'est la cle, l'utilisateur ou l'empreinte de l'hote.
          if ! trace=$(ssh -v -o BatchMode=yes -i "$KEY" -p "${PORT:-22}" \
                          "$USER@$HOST" "mkdir -p '$TARGET' && echo pret" 2>&1); then
            echo "$trace" | tail -40
            case "$trace" in
              *"Host key verification failed"*)
                echo "::error::Empreinte du serveur refusée. VPS_KNOWN_HOSTS ne correspond pas à VPS_HOST." ;;
              *"Permission denied"*)
                echo "::error::Clé rejetée. L'utilisateur VPS_USER n'a pas cette clé dans son authorized_keys — vérifie que VPS_USER vaut bien le compte de déploiement." ;;
              *"Connection refused"*|*"Connection timed out"*|*"No route to host"*|*"Could not resolve"*)
                echo "::error::Serveur injoignable. Vérifie VPS_HOST et VPS_PORT." ;;
              *)
                echo "::error::Échec SSH, voir la trace ci-dessus." ;;
            esac
            exit 1
          fi
          echo "$trace" | tail -2
          rsync -az --delete \
            -e "ssh -o BatchMode=yes -i $KEY -p ${PORT:-22}" \
            dist/ "$USER@$HOST:$TARGET/"

      - name: Archiver le build
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist
          retention-days: 30

      - name: Créer la release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf toscacolor-${{ github.ref_name }}.tar.gz -C dist .
          gh release create "${{ github.ref_name }}" \
            toscacolor-${{ github.ref_name }}.tar.gz \
            --title "ToscaColor ${{ github.ref_name }}" \
            --generate-notes

      - name: Nettoyer la clé
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Vérifier que le site répond
        run: |
          url=https://tosca.walautao.fr/
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 "$url" 2>/tmp/curl.err || true)
          echo "$url -> HTTP ${code:-aucune réponse}"
          if [ "$code" = "200" ]; then exit 0; fi
          cat /tmp/curl.err || true
          # Les fichiers sont déjà en place : ce qui échoue ici, c'est l'accès public.
          if grep -qi "certificate" /tmp/curl.err; then
            echo "::error::Le déploiement a réussi, mais le certificat ne correspond pas à tosca.walautao.fr. Relancer sur le VPS : certbot --nginx -d tosca.walautao.fr — sans HTTPS, ni service worker, ni mode hors ligne, ni partage natif."
          elif [ "$code" = "403" ]; then
            echo "::error::Le serveur répond 403 : le dossier /var/www/tosca est vide ou nginx ne pointe pas dessus."
          else
            echo "::error::Le site ne répond pas correctement (HTTP ${code:-aucune réponse}). Le build et l'envoi ont pourtant réussi."
          fi
          exit 1
