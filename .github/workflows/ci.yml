name: Vérification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Types et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run build

      # Le poids compte : l'appli doit rester utilisable en 4G dans la voiture.
      - name: Taille du bundle
        run: du -sh dist && ls -lh dist/assets
