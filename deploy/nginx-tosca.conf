# tosca.walautao.fr — vhost de ToscaColor
#
# À déposer dans /etc/nginx/sites-available/tosca, UNE SEULE FOIS.
# Certbot ajoute ensuite ici son bloc 443 et la redirection : réécrire ce
# fichier après coup ferait sauter le HTTPS, et donc le service worker.
#
# Les règles de l'application vivent dans le snippet, qui lui peut être
# remplacé à volonté.

server {
    listen 80;
    listen [::]:80;
    server_name tosca.walautao.fr;

    include snippets/tosca-app.conf;
}
