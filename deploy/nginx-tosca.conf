# tosca.walautao.fr — site statique + PWA
# a placer dans /etc/nginx/sites-available/tosca puis lier dans sites-enabled.
# Le bloc HTTPS est ajoute automatiquement par : certbot --nginx -d tosca.walautao.fr

server {
    listen 80;
    listen [::]:80;
    server_name tosca.walautao.fr;

    root /var/www/tosca;
    index index.html;

    # SPA : toutes les routes retombent sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le service worker ne doit jamais etre mis en cache, sinon l'appli
    # reste bloquee sur une ancienne version chez les enfants.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Les assets sont versionnes par Vite : cache long sans risque.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Aucune donnee ne sort de l'appareil, mais on verrouille quand meme.
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer";
}
