# Règles applicatives de ToscaColor.
# À déposer dans /etc/nginx/snippets/tosca-app.conf
#
# Ce fichier est inclus par le vhost. C'est celui-ci qu'on met à jour quand les
# règles changent : le vhost, lui, contient les blocs écrits par Certbot et ne
# doit plus être écrasé une fois le certificat émis.

root /var/www/tosca;
index index.html;

# SPA : toutes les routes retombent sur index.html
location / {
    try_files $uri $uri/ /index.html;
}

# Ni le service worker ni son script d'enregistrement ne doivent être mis en
# cache, sinon un navigateur reste coincé sur une ancienne version de l'appli.
location = /sw.js {
    add_header Cache-Control "no-cache, must-revalidate";
}
location = /registerSW.js {
    add_header Cache-Control "no-cache, must-revalidate";
}
location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
}

# Les assets sont versionnés par Vite : cache long sans risque.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

gzip on;
gzip_min_length 1024;
gzip_types text/css application/javascript image/svg+xml application/json;

# Aucune donnée ne sort de l'appareil, mais on verrouille quand même.
add_header X-Content-Type-Options "nosniff";
add_header Referrer-Policy "no-referrer";
